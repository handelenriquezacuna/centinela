# Lo comun de todo lo que `web` reenvia a `api` (D-73). El mismo origen para el navegador:
# la cookie HttpOnly SameSite=Strict de la sesion viaja sola y la tabla de permisos la
# aplica la API, no nginx.
proxy_pass http://api;
proxy_http_version 1.1;
# Conexion hacia la API sin la cabecera `Connection: close` por omision (keepalive del upstream).
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
