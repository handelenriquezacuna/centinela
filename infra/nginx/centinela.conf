# `web` (D-73): nginx sin privilegios que sirve la SPA construida y reenvia /api, /estado,
# /salud y /openapi.json al servicio `api`. Mismo origen para el navegador.
#
# El servicio comparte el espacio de red de mongo1 (igual que `api`): la API es
# 127.0.0.1:8000 y este servidor escucha en 8080, que mongo1 publica como 127.0.0.1:8000.
# No tiene credenciales ni driver de Mongo: no habla con la base, solo con la API.

# Los upstream con direccion literal: nginx arranca aunque `api` todavia no este arriba.
upstream api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Sin version en las cabeceras ni en las paginas de error.
server_tokens off;

# Texto comprimido; el canal SSE no (su tipo no esta en la lista y ademas se apaga abajo).
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    # Las peticiones de la API son JSON chico; nada sube archivos.
    client_max_body_size 1m;

    # Salud PROPIA de nginx (la del HEALTHCHECK): no depende de la API. La de la API, y la
    # de la base, es /salud.
    location = /nginx-salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Canales SSE -------------------------------------------------------------------
    # El navegador abre UNA conexion larga y el servidor empuja eventos. Sin estas lineas
    # nginx acumularia la respuesta en un buffer y el panel no veria nada hasta que se
    # llene: proxy_buffering off, sin cache, sin compresion, y un read_timeout alto
    # (la API manda un comentario cada canal.ping_segundos, pero un corte de red no debe
    # cerrar el canal antes de tiempo). `X-Accel-Buffering: no` lo repite hacia nginx de
    # delante si algun dia lo hay. El `Cache-Control: no-store` lo pone la API.
    location = /api/v1/alertas/eventos {
        include /etc/nginx/centinela/proxy-api.conf;
        include /etc/nginx/centinela/cabeceras.conf;
        add_header X-Accel-Buffering "no" always;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # El canal HTML de HTMX (respaldo hasta T-68): el mismo trato.
    location = /api/v1/alertas/flujo {
        include /etc/nginx/centinela/proxy-api.conf;
        include /etc/nginx/centinela/cabeceras.conf;
        add_header X-Accel-Buffering "no" always;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # --- Respaldos ---------------------------------------------------------------------
    # Crear y verificar corren mongodump y mongorestore dentro de la peticion: pueden pasar
    # del minuto por omision (el tope real es respaldos.tiempo_maximo_segundos, 1800 s).
    location ^~ /api/v1/respaldos {
        include /etc/nginx/centinela/proxy-api.conf;
        include /etc/nginx/centinela/cabeceras.conf;
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;
    }

    # --- El resto de la API -------------------------------------------------------------
    location ^~ /api/ {
        include /etc/nginx/centinela/proxy-api.conf;
        include /etc/nginx/centinela/cabeceras.conf;
        proxy_read_timeout 60s;
    }

    location = /salud {
        include /etc/nginx/centinela/proxy-api.conf;
        include /etc/nginx/centinela/cabeceras.conf;
        proxy_read_timeout 10s;
    }

    location = /estado {
        include /etc/nginx/centinela/proxy-api.conf;
        include /etc/nginx/centinela/cabeceras.conf;
        proxy_read_timeout 30s;
    }

    location = /openapi.json {
        include /etc/nginx/centinela/proxy-api.conf;
        include /etc/nginx/centinela/cabeceras.conf;
        proxy_read_timeout 30s;
    }

    # --- Estaticos ---------------------------------------------------------------------
    # Los archivos del build llevan el hash en el nombre: cambian de nombre cuando cambian
    # de contenido, asi que se pueden guardar un ano.
    location ^~ /estaticos/spa/assets/ {
        include /etc/nginx/centinela/cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # centinela.css y el resto no llevan hash: se revalidan (ETag) en cada uso.
    location ^~ /estaticos/ {
        include /etc/nginx/centinela/cabeceras.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Un archivo que no existe (favicon.ico, un .js viejo) es 404, no la pagina de la SPA:
    # sin esto, el navegador recibiria HTML donde esperaba un script.
    location ~ \.[A-Za-z0-9]+$ {
        return 404;
    }

    # --- La SPA -------------------------------------------------------------------------
    # Toda ruta de pagina (/, /login, /panel, /detalle/ALR-001, /busqueda, /red-mulas/...,
    # /tablero, /reglas, /respaldos y las que vengan) recibe el mismo index.html: React
    # Router dibuja la pantalla. Sin cache, porque el index nombra los archivos con hash
    # del build vigente. La sesion y los permisos los decide la API: esta pagina no trae datos.
    location / {
        include /etc/nginx/centinela/cabeceras.conf;
        add_header Cache-Control "no-cache" always;
        try_files /estaticos/spa/index.html =404;
    }
}
