# CI de Centinela: se dispara en cada pull request hacia `dev` o `main` y en cada
# push a `dev` (lo que queda en el tronco despues de un merge tambien se prueba).
#
# Compuertas, en este orden: ruff, y las pruebas de los cuatro tipos que declara
# docs/06-plataforma.md (unitarias, contrato, integracion, arquitectura) y, al final,
# los recorridos extremo a extremo con navegador real (T-58). Si cualquiera falla, el PR no se puede fusionar.
#
# Sobre "integracion": el repo todavia no tiene una carpeta pruebas/integracion.
# Las pruebas que ejercen el camino real HTTP -> repo -> MongoDB viven hoy dentro de
# pruebas/contrato/ (por ejemplo prueba_alertas_mongo.py y
# prueba_validadores_mongo.py) y estan marcadas `@pytest.mark.mongo`. Esa marca es la
# que separa "integracion" del resto: unitarias, contrato (sin mongo) y arquitectura
# no tocan una base de datos real y corren con `-m "not mongo"`; todo lo que si la
# necesita corre con `-m mongo`. El dia que exista pruebas/integracion como carpeta,
# este archivo se ajusta, pero el mecanismo de separacion por marca no cambia.
#
# Por que un replica set de UN nodo y no standalone: las pruebas marcadas `mongo`
# usan change streams (`app/repos/flujo_alertas.py`, `app/repos/salud.py`), y un
# Mongo standalone los rechaza con `Location40573` ("$changeStream stage is only
# supported on replica sets"). Un solo nodo ya es un replica set valido y alcanza:
# los change streams solo piden que exista el oplog, no que haya companeros.
#
# Por que NO se usa la clave `services:` de Actions para levantar Mongo: `services:`
# no permite pasarle argumentos al `command` del contenedor de forma directa y
# sencilla (hay formas indirectas, todas mas fragiles que la alternativa elegida
# aca), y ademas no hay forma comoda de correr `rs.initiate()` como paso separado
# antes de que el resto del job empiece a usarlo. Por eso este workflow levanta Mongo
# con un `docker run` explicito, espera con un sondeo, inicializa el replica set con
# `mongosh` DENTRO del propio contenedor (`docker exec`; la imagen `mongo:8` ya trae
# `mongosh`, asi que el runner no necesita instalarlo aparte) y recien despues corre
# las pruebas.
#
# La URI de un solo nodo NO se escribe en config/centinela.yml (esa URI es la de los
# tres nodos de infra/docker-compose.yml y no cambia por CI). Se pasa por la variable
# de entorno CENTINELA_MONGO__URI, que le gana al YAML por la precedencia que
# pruebas/contrato/prueba_configuracion.py verifica. Es el mismo mecanismo que
# cualquier persona del equipo usaria para apuntar a otra base sin tocar el repo.
#
# La base sembrada y el modo estricto. Las pruebas de validadores leen los
# `$jsonSchema` reales de la base `antifraude`, y sin semilla se saltaban: la primera
# corrida de este workflow salio verde con 13 passed y 26 skipped. Por eso, despues de
# levantar Mongo, se corren 01 -> 02 -> 03 de scripts/semilla/ (el mismo orden que
# `python tareas.py datos-demo`; los scripts escriben a `antifraude` con
# getSiblingDB) y el paso de integracion corre con CENTINELA_EXIGIR_MONGO=1: con esa
# variable, "Mongo no responde" o "la base no esta sembrada" son fallas, no saltos
# (pruebas/conftest.py, `saltar_o_fallar`). `-rs` deja en el log el motivo de
# cualquier salto que quede.
#
# Endurecimiento: el token del job solo lee el repo, una corrida nueva en la misma
# rama cancela la anterior, y las acciones van fijadas por SHA de commit (la
# etiqueta, en el comentario) para que nadie pueda mover lo que corre aca moviendo
# una etiqueta. Para actualizar una: `gh api repos/<duenio>/<accion>/git/ref/tags/<tag>`
# y, si el objeto es de tipo `tag`, desreferenciarlo hasta el commit.
#
# Auditoria de dependencias: es una compuerta. `uv export` exporta el lock y pip-audit
# (version fija) busca vulnerabilidades conocidas en esas versiones; si encuentra una,
# el paso falla y el PR no se puede fusionar. Para subir pip-audit, cambiar su version
# fijada en el paso y correr el mismo comando en local antes de empujar.
#
# Frontend (T-61): la SPA React vive en frontend/. Node se instala con
# actions/setup-node fijado por SHA (la accion corre sobre node24) y con la version EXACTA
# de frontend/.nvmrc, la misma que usa el equipo en local. `npm ci` instala lo que dice
# package-lock.json, nada mas; el cache es el de npm, por el hash del lock. Compuertas:
# lint, typecheck, Vitest, `npm audit --audit-level=high` (cero hallazgos altos o
# criticos) y el build, que escribe app/estaticos/spa/. El build va ANTES de las e2e: la
# SPA es la interfaz por omision (T-67), el servidor e2e principal la sirve y, en modo
# estricto, falta de build es falla.
#
# Lo que a proposito NO esta aqui: pruebas de rendimiento y de resiliencia. La
# resiliencia (que el replica set elija otro primario si el actual cae, y que D1 no
# duplique ni pierda alertas) necesita tres nodos con eleccion real y Docker con puertos
# fijos; con un solo nodo no hay a quien elegir. Vive en pruebas/resiliencia/, levanta sus
# propios contenedores, y es una compuerta manual antes de cada hito:
# `python tareas.py resiliencia`. Razones en docs/06-plataforma.md.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"

      - name: Sincronizar dependencias exactas del lock
        run: uv sync --locked

      - name: Compuerta -- ruff
        run: uv run ruff check .

      - name: Instalar Node (version de frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias exactas del frontend (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Compuerta -- frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Compuerta -- frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Compuerta -- frontend pruebas de componentes (Vitest)
        working-directory: frontend
        run: npm test

      - name: Compuerta -- frontend auditoria de dependencias
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Construir la SPA (app/estaticos/spa, antes de las e2e)
        working-directory: frontend
        run: npm run build

      # Auditoria de dependencias: exporta el lock exacto (sin hashes, el mismo formato que
      # usa el equipo en local) y lo audita con pip-audit en version fija. pipefail hace que
      # un fallo de uv export tambien corte el paso, no solo un hallazgo de pip-audit.
      # Sin hallazgos, pip-audit sale con 0; con cualquier vulnerabilidad conocida, sale con 1.
      - name: Compuerta -- auditoria de dependencias
        run: |
          set -euo pipefail
          uv export --format requirements-txt --no-hashes --frozen \
            | uvx pip-audit==2.10.1 -r /dev/stdin --disable-pip --no-deps

      - name: Levantar Mongo como replica set de un nodo
        run: |
          set -euo pipefail

          # scripts/semilla se monta de solo lectura para correr la semilla con
          # --file desde dentro del contenedor, igual que tareas.py la corre desde el host.
          docker run -d --name centinela-mongo -p 27018:27018 \
            -v "$GITHUB_WORKSPACE/scripts/semilla:/semilla:ro" mongo:8 \
            mongod --replSet rsfraude --port 27018 --bind_ip_all

          echo "Esperando a que el nodo responda..."
          timeout 60 bash -c '
            until docker exec centinela-mongo mongosh --port 27018 --quiet \
              --eval "db.adminCommand({ping: 1}).ok" > /dev/null 2>&1; do
              sleep 2
            done
          '

          echo "Inicializando el replica set rsfraude (un nodo alcanza para change streams)..."
          docker exec centinela-mongo mongosh --port 27018 --quiet --eval '
            rs.initiate({ _id: "rsfraude", members: [{ _id: 0, host: "localhost:27018" }] })
          '

          echo "Esperando la eleccion del primario..."
          timeout 60 bash -c '
            until [ "$(docker exec centinela-mongo mongosh --port 27018 --quiet \
              --eval "rs.status().members[0].stateStr")" = "PRIMARY" ]; do
              sleep 2
            done
          '

      - name: Sembrar la base antifraude (01 -> 02 -> 03 -> 05, el orden de datos-demo)
        run: |
          set -euo pipefail
          for script in 01-colecciones.js 02-indices.js 03-catalogos.js 05-vistas.js; do
            echo "Sembrando $script..."
            docker exec centinela-mongo mongosh --port 27018 --quiet \
              --file "/semilla/$script"
          done

      - name: Compuerta -- pruebas unitarias, de contrato y de arquitectura (sin Mongo)
        env:
          CENTINELA_MONGO__URI: "mongodb://localhost:27018/?replicaSet=rsfraude"
        run: uv run pytest -m "not mongo" -q

      # Las pruebas de migracion corren scripts/migraciones/*.js con mongosh desde el
      # host, igual que `python tareas.py migrar`. El runner no lo trae: se instala con
      # version fija para que el resultado no cambie con cada publicacion de mongosh.
      - name: Instalar mongosh en el runner
        run: npm install -g mongosh@2.9.2 && mongosh --version

      # D-74: los respaldos corren mongodump y mongorestore de verdad (integracion y e2e). Son
      # las MongoDB Database Tools con version y sha256 fijos, los mismos de infra/Dockerfile
      # (la imagen de la API instala exactamente estos binarios).
      - name: Instalar mongodump y mongorestore en el runner
        run: |
          set -euo pipefail
          version=100.20.1
          nombre="mongodb-database-tools-ubuntu2404-x86_64-$version"
          curl -fsSL "https://fastdl.mongodb.org/tools/db/$nombre.tgz" -o /tmp/herramientas.tgz
          echo "20f43dcaa37f5a4841ac5a91da685a488a5ebbd81113c018e25a6b544cc350ea  /tmp/herramientas.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/herramientas.tgz -C /usr/local/bin --strip-components=2 \
            "$nombre/bin/mongodump" "$nombre/bin/mongorestore"
          mongodump --version | head -1

      - name: Compuerta -- pruebas de integracion (Mongo real, change streams)
        env:
          CENTINELA_MONGO__URI: "mongodb://localhost:27018/?replicaSet=rsfraude"
          CENTINELA_EXIGIR_MONGO: "1"
        run: uv run pytest -m mongo -q -rs

      # Pruebas extremo a extremo (T-58, D-51): Chromium real contra un uvicorn real y
      # este mismo Mongo, en la base propia antifraude_pruebas_e2e. El navegador se cachea
      # por version de playwright (cada version trae su build de Chromium); `install
      # --with-deps` corre siempre porque las bibliotecas del sistema no viven en el cache.
      # Si algo falla, las trazas de Playwright (capturas, DOM y red de cada paso) se suben
      # como artefacto: docs/06-plataforma.md explica como abrirlas.
      - name: Version de playwright (llave del cache)
        id: playwright
        run: |
          set -euo pipefail
          version="$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cachear el navegador de Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        run: uv run playwright install --with-deps chromium

      - name: Compuerta -- pruebas extremo a extremo (navegador real)
        env:
          CENTINELA_MONGO__URI: "mongodb://localhost:27018/?replicaSet=rsfraude"
          CENTINELA_EXIGIR_MONGO: "1"
        run: uv run pytest -m e2e -rs

      # D-73: las dos imagenes (web con nginx y la SPA, api con mongodump) tienen que
      # construirse. Es la unica compuerta que prueba el Dockerfile.
      - name: Compuerta -- construir las imagenes web y api
        run: |
          set -euo pipefail
          docker build -f infra/Dockerfile --target web -t centinela-web:ci .
          docker build -f infra/Dockerfile --target api -t centinela-api:ci .

      - name: Subir las trazas de Playwright si algo fallo
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trazas-e2e
          path: pruebas/e2e/trazas/
          if-no-files-found: ignore
          retention-days: 7

      - name: Apagar Mongo
        if: always()
        run: docker rm -f centinela-mongo || true
