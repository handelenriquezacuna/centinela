# Replica set de 3 nodos para SC-609 Proyecto Antifraude.
# Los Change Streams y las transacciones multi-documento EXIGEN replica set.
#
# mongo2 y mongo3 comparten el espacio de red de mongo1 (network_mode:
# service:mongo1). Asi los tres se ven entre si en localhost y el host
# alcanza los tres por los puertos publicados, sin tocar /etc/hosts.
#
# Los servicios `api` y `web` (modalidad de arranque B, H-00B y D-73: la API y el portal
# tambien dentro de Compose) hacen exactamente lo mismo que mongo2 y mongo3: entran al
# espacio de red de mongo1 con `network_mode: service:mongo1`. Por eso el puerto del
# portal se publica en la lista `ports` de MONGO1 y no en la de `web`: un servicio con
# `network_mode: service:X` no puede declarar sus propios `ports`, porque no tiene su
# propia pila de red; la tiene prestada.
#
# Por que `api` comparte la red de mongo1 y no una red propia: los miembros del replica
# set se anuncian como localhost:27018-27020 (scripts/init-replicaset.js), y el driver, al
# descubrir el conjunto, reconecta a esos nombres. Solo en el espacio de red de mongo1
# `localhost:27018` es el nodo. Cualquier otra red (un bridge con nombres de servicio)
# obligaria a re-anunciar los miembros con otros nombres y romperia la modalidad A, que
# usa los mismos nombres desde el host. Es la misma razon por la que mongo2 y mongo3 lo
# hacen, y el resultado es una sola URI en config/centinela.yml para las dos modalidades.
#
# `web` (nginx) comparte esa red por la misma razon practica: tiene que alcanzar a `api`
# (127.0.0.1:8000) y es lo unico que no obliga a publicar la API. Escucha en 8080 y mongo1 lo
# publica como 127.0.0.1:8000, el puerto de siempre del portal. La API NO se publica: solo
# `web` la alcanza. "Sin acceso a Mongo" se cumple por credenciales y por contenido, no por
# aislamiento de red: la imagen web no lleva driver, ni URI, ni claves, ni volumenes de datos.
#
# `api` y `web` llevan `profiles: ["app"]` para que un `docker compose up` sin mas siga
# levantando solo el replica set (la modalidad A, la que el equipo ya usa a diario) y
# nadie se encuentre con contenedores nuevos sin pedirlos. `python tareas.py arriba
# --con-app` es quien pide el perfil explicitamente.

# Nombre de proyecto explicito: sin esta clave, Compose lo deriva del nombre del
# directorio del archivo ("infra"), asi que el proyecto depende de donde este clonado
# el repo. Con el nombre fijo, dos personas con el repo en carpetas distintas obtienen
# el mismo proyecto.
#
# Lo que este nombre NO resuelve: la colision entre varios checkouts del repo. Todos
# comparten este archivo, asi que todos derivaban el mismo nombre antes y todos usan
# `centinela` ahora: es la misma colision con otro nombre. Lo que la evita es la regla
# de operacion -solo el checkout principal corre `docker compose`-, documentada en
# docs/06-plataforma.md seccion 4.
name: centinela

# restart: unless-stopped en cada servicio: tras reiniciar Docker Desktop los nodos vuelven solos y no quedan Exited (137).
services:
  mongo1:
    image: mongo:8
    container_name: fraude-mongo1
    restart: unless-stopped
    entrypoint: ["bash","/entrada/mongo-entrada.sh"]
    command: ["mongod","--replSet","rsfraude","--port","27018","--bind_ip_all","--wiredTigerCacheSizeGB","0.5"]
    environment:
      CENTINELA_SIN_AUTH: ${CENTINELA_SIN_AUTH:-}
    ports:
      # Solo en la interfaz local (H-25): ni un puerto de Mongo ni de la API queda
      # expuesto a la red del anfitrion. Los miembros se hablan por localhost dentro
      # del espacio de red compartido, asi que esto no les afecta.
      - "127.0.0.1:27018:27018"   # primario
      - "127.0.0.1:27019:27019"   # mongo2
      - "127.0.0.1:27020:27020"   # mongo3
      - "127.0.0.1:8000:8080"     # el portal: nginx del servicio web (comparte este espacio de red)
    volumes:
      - mongo1data:/data/db
      # H-25: el punto de entrada que agrega --keyFile y el keyfile que genera tareas.py.
      - ./mongo-entrada.sh:/entrada/mongo-entrada.sh:ro
      - ./secretos:/secretos:ro
      # Este montaje queda por compatibilidad, pero NO es la forma recomendada de
      # correr un script, y conviene saber por que: el clúster es uno solo y lo
      # recrea quien corre `up` de ultimo, asi que /scripts apunta a la carpeta del
      # host de esa persona. Desde otro checkout, `mongosh --file /scripts/x.js`
      # lee el archivo de otro, o no lo encuentra.
      #
      # La forma robusta es correr mongosh DESDE EL HOST con la ruta absoluta del
      # host y la URI completa del replica set. Asi el archivo lo lee el host y el
      # driver descubre el primario aunque no sea mongo1. Es lo que hace tareas.py.
      - ../scripts:/scripts:ro
    healthcheck:
      test: ["CMD","mongosh","--port","27018","--quiet","--eval","db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo2:
    image: mongo:8
    container_name: fraude-mongo2
    restart: unless-stopped
    network_mode: "service:mongo1"
    entrypoint: ["bash","/entrada/mongo-entrada.sh"]
    command: ["mongod","--replSet","rsfraude","--port","27019","--bind_ip_all","--wiredTigerCacheSizeGB","0.5"]
    environment:
      CENTINELA_SIN_AUTH: ${CENTINELA_SIN_AUTH:-}
    volumes:
      - mongo2data:/data/db
      - ./mongo-entrada.sh:/entrada/mongo-entrada.sh:ro
      - ./secretos:/secretos:ro
    depends_on:
      mongo1:
        condition: service_healthy

  mongo3:
    image: mongo:8
    container_name: fraude-mongo3
    restart: unless-stopped
    network_mode: "service:mongo1"
    entrypoint: ["bash","/entrada/mongo-entrada.sh"]
    command: ["mongod","--replSet","rsfraude","--port","27020","--bind_ip_all","--wiredTigerCacheSizeGB","0.5"]
    environment:
      CENTINELA_SIN_AUTH: ${CENTINELA_SIN_AUTH:-}
    volumes:
      - mongo3data:/data/db
      - ./mongo-entrada.sh:/entrada/mongo-entrada.sh:ro
      - ./secretos:/secretos:ro
    depends_on:
      mongo1:
        condition: service_healthy

  # Modalidad de arranque B (H-00B, D-73): la API y el portal tambien dentro de Compose.
  # Ninguno lleva `ports` (ver la nota de arriba) ni su propia red: comparten la de mongo1.
  # `profiles: ["app"]` los deja afuera de un `docker compose up` sin argumentos.
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    container_name: fraude-api
    restart: unless-stopped
    profiles: ["app"]
    network_mode: "service:mongo1"
    # Sistema de archivos de solo lectura: lo unico escribible es /tmp (sin estado) y el
    # volumen de respaldos.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Las URI con usuario las arma tareas.py desde .env (H-25, D-74). Nunca van en el repo
      # ni en config/centinela.yml. La de respaldo es la del usuario centinela_respaldo.
      CENTINELA_MONGO__URI: ${CENTINELA_MONGO__URI:-}
      CENTINELA_RESPALDOS__URI: ${CENTINELA_RESPALDOS__URI:-}
    volumes:
      # Los respaldos (D-74) sobreviven a la recreacion del contenedor. El directorio
      # (/respaldos) lo fija el Dockerfile con CENTINELA_RESPALDOS__DIRECTORIO.
      - respaldos:/respaldos
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_started
      mongo3:
        condition: service_started

  # El portal: nginx sin privilegios con la SPA y el proxy a `api` (D-73). Sin variables de
  # entorno, sin volumenes y sin dependencia de Mongo: no habla con la base.
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    container_name: fraude-web
    restart: unless-stopped
    profiles: ["app"]
    network_mode: "service:mongo1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy

# Volumenes normales, sin `external` y sin `name`: Compose los crea y los administra.
#
# Esto es deliberado y ya se equivoco una vez. Un volumen declarado `external: true`
# Compose NO lo crea: asume que existe, y si no existe `up` falla con
# `external volume "..." not found` antes de arrancar un solo contenedor. En la maquina
# de quien clona el repo por primera vez -o en un corredor de CI, o en la del profesor
# el dia de la defensa- eso es un arranque roto en el primer paso.
#
# El motivo para haberlos fijado era conservar una siembra existente, y la cuenta no
# cerraba: la base entera se regenera en segundos con `datos-demo` (01 -> 02 -> 03 mas
# los documentos de dominio, todo idempotente). Perder un volumen viejo no cuesta nada;
# que un companero no pueda arrancar cuesta el proyecto.
volumes:
  mongo1data:
  mongo2data:
  mongo3data:
  # Los respaldos de la API (D-74): archivos .gz y manifiestos JSON.
  respaldos:
