[project]
name = "centinela"
version = "0.1.0"
description = "Monitoreo de fraude bancario en tiempo real sobre transferencias SINPE Movil"
readme = "README.md"
requires-python = ">=3.13,<3.14"

# Versiones fijas a proposito (regla del stack): dos maquinas del equipo instalan
# exactamente lo mismo. Subir una version es un cambio deliberado con su commit.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pymongo==4.18.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "sse-starlette==3.4.11",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    # AsyncClient de httpx no dispara el lifespan de la app; el cliente de Mongo se
    # crea justamente ahi. Sin esto las pruebas de API corren sin cliente.
    "asgi-lifespan==2.1.0",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["prueba_*.py", "test_*.py"]
python_functions = ["prueba_*", "test_*"]
python_classes = ["Prueba*", "Test*"]
asyncio_mode = "strict"
markers = [
    "mongo: necesita el replica set rsfraude arriba; se salta si no responde",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
