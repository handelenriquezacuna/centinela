# Cabeceras de seguridad de cada respuesta de `web` (D-73). Se incluye en cada location
# porque `add_header` de un nivel REEMPLAZA (no suma) a las del nivel de arriba: una
# location con su propio add_header perderia estas si solo estuvieran en `server`.
#
# La CSP es la que la SPA cumple sin CDN: todo sale de este origen. `style-src
# 'unsafe-inline'` porque React y los graficos escriben atributos `style`; los scripts no
# tienen inline (`script-src 'self'`). `frame-ancestors 'none'` y `form-action 'self'` cierran
# el clickjacking y los formularios hacia otros sitios.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
