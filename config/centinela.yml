# Configuracion tecnica de Centinela.
#
# Tres reglas sobre este archivo, y las tres se verifican con una prueba:
#
# 1. NO va ni un numero de negocio. Ni umbrales, ni pesos de reglas, ni cortes de
#    severidad: eso vive en Mongo (coleccion politica_deteccion) para poder
#    cambiarlo sin desplegar. Aca solo va lo tecnico: puertos, tiempos de espera,
#    topes de paginacion HTTP.
# 2. NO van secretos. Los secretos entran por variable de entorno; el molde esta
#    en infra/.env.ejemplo.
# 3. Todo lo de aqui se puede sobrescribir. Precedencia, de mayor a menor:
#       entorno  >  config/centinela.local.yml  >  config/centinela.yml
#    El archivo local no se versiona (esta en .gitignore) y solo necesita las
#    claves que quiere cambiar: el resto se hereda de este archivo.
#
# En entorno, el prefijo es CENTINELA_ y el separador de nivel es doble guion bajo:
#       CENTINELA_APP__PAGINA_MAXIMA=25
#       CENTINELA_MONGO__BASE=antifraude_pruebas

app:
  nombre: Centinela
  entorno: dev
  # Topes de paginacion de la API. Son guardas tecnicas, no reglas de negocio:
  # protegen al servidor de una peticion que pida un millon de documentos.
  pagina_por_omision: 50
  pagina_maxima: 200

servidor:
  host: 127.0.0.1
  puerto: 8000
  recarga: true

mongo:
  # Una sola URI para las dos modalidades de arranque, y esto no es casualidad:
  # scripts/init-replicaset.js declara los miembros como localhost:27018/19/20, y
  # mongo1 publica esos tres puertos. Entonces la misma cadena resuelve
  #   - desde el host, por los puertos publicados
  #   - desde un contenedor con network_mode: service:mongo1, que comparte el
  #     espacio de red y ve los tres nodos en su propio localhost
  # Cambiar esto por nombres de servicio de Compose rompe la modalidad de host.
  uri: "mongodb://localhost:27018,localhost:27019,localhost:27020/?replicaSet=rsfraude"
  base: antifraude
  tiempo_espera_seleccion_ms: 5000

# Vigilancia de las tareas de fondo, la que reporta GET /estado. Tiempos tecnicos:
# cada cuanto el proceso se toma el pulso, y cuanto silencio se tolera antes de
# declarar una tarea retrasada. La tolerancia es varias veces el intervalo a
# proposito: si fueran parecidos, un latido que llega un instante tarde dejaria el
# sistema en degradado sin que nada este mal.
supervision:
  intervalo_latido_segundos: 5
  tolerancia_retraso_segundos: 30

# Canal SSE de alertas (GET /api/v1/alertas/flujo).
canal:
  # Comentario de mantenimiento por la conexion abierta, para que un proxy no la
  # cierre por inactividad cuando no hay alertas.
  ping_segundos: 15
  # Espera del navegador antes de reconectar; viaja como `retry` en la apertura.
  reintento_ms: 3000

# Disparador D1 (H-09): change stream de transacciones -> alerta. Tiempos tecnicos.
deteccion:
  # Espera del cursor por una transaccion nueva antes de devolver una vuelta vacia.
  # Cada vuelta es un latido de D1 en /estado: tiene que ser bastante menor que
  # supervision.tolerancia_retraso_segundos (lo exige la configuracion al arrancar).
  espera_cursor_ms: 1000
  # Reintentos de un evento que fallo, con espera progresiva (se duplica hasta el
  # tope). Agotados, el evento queda en deteccion_estado como descarte.
  reintentos: 3
  espera_inicial_segundos: 0.5
  espera_maxima_segundos: 10

# Disparador D3 (H-22): recalcula los indicadores del dia actual en indicadores_diarios.
indicadores:
  # Cada cuantos segundos. Menor que supervision.tolerancia_retraso_segundos, porque
  # cada recalculo es un latido de D3 en /estado.
  intervalo_segundos: 10

# Sesion del portal y la API (H-25). La clave de firma NO va aqui: entra por la variable
# de entorno CENTINELA_SESION__CLAVE (minimo 32 caracteres). Sin ella, en entorno dev se
# genera una al arrancar y /estado lo advierte; en otro entorno no arranca.
sesion:
  # Duracion de la sesion, en minutos.
  minutos: 60
  # true = la cookie solo viaja por HTTPS. Encender detras de TLS.
  cookie_segura: false
  nombre_cookie: centinela_sesion

registro:
  nivel: INFO

# Generador de datos sinteticos (H-03, H-04, H-05): `python -m app.generador`.
# Son parametros de simulacion, no reglas de deteccion: las reglas siguen en Mongo.
# Cada valor se puede pasar tambien por la linea de comandos (--clientes, etc.).
generador:
  # Misma semilla, mismos datos.
  semilla: 20261207
  clientes: 200
  transacciones: 5000
  # Transacciones por segundo al insertar; 0 = sin limite. Con el detector D1
  # corriendo, un valor bajo (20) permite ver las alertas aparecer en vivo.
  ritmo_por_segundo: 0
  # Fraccion del volumen que se inyecta como anomalo (0.012 = 1,2 %). Tiene que ser
  # menor a 0.02: el generador rechaza un valor mayor.
  proporcion_anomalos: 0.012
  # La historia generada termina en esta fecha (UTC) y cubre dias_historia hacia atras.
  fecha_fin: 2026-11-22
  dias_historia: 30
  tamano_lote: 1000
  # Fraccion (0 a 1) de las cuentas mula de las cadenas que se reporta en
  # listas_riesgo, con fecha anterior a su primera transaccion recibida.
  proporcion_mulas_reportadas: 0.5
  # SINPE Movil depende del banco: el tope por transferencia va de 100.000 a 300.000
  # colones segun la entidad. Ninguna transaccion generada supera el tope de la
  # entidad de su cuenta de origen. Agregar o cambiar entidades no toca codigo.
  # Valores ilustrativos dentro del rango real de SINPE Movil (100.000 a 300.000
  # segun la entidad).
  entidades:
    - { nombre: "Entidad A", tope_crc: 300000 }
    - { nombre: "Entidad B", tope_crc: 200000 }
    - { nombre: "Entidad C", tope_crc: 150000 }
    - { nombre: "Entidad D", tope_crc: 100000 }
    - { nombre: "Entidad E", tope_crc: 250000 }
